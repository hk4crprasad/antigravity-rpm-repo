name: Update RPM Repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.10)'
        required: true

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y createrepo-c rpm gnupg2

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo -e "5\ny\n" | gpg --batch --command-fd 0 \
            --edit-key "${{ secrets.GPG_KEY_ID }}" trust quit

      - name: Download RPMs from release
        run: |
          mkdir -p packages
          gh release download ${{ inputs.tag }} \
            --pattern "*.rpm" \
            --dir packages/ \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate repo metadata
        run: createrepo_c --update .

      - name: Sign repomd.xml
        run: |
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" \
            --detach-sign --armor repodata/repomd.xml

      - name: Write .repo file
        run: |
          printf '[antigravity]\nname=Antigravity RPM Repository\nbaseurl=https://hk4crprasad.github.io/antigravity-rpm-repo/\nenabled=1\ngpgcheck=0\nrepo_gpgcheck=1\ngpgkey=https://hk4crprasad.github.io/antigravity-rpm-repo/RPM-GPG-KEY.asc\n' > antigravity.repo

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repo: update for ${{ inputs.tag }}" \
            || echo "Nothing to commit"
          git push origin gh-pages
