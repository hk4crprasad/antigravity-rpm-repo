name: Update RPM Repository

on:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y createrepo-c rpm gnupg2 curl

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo -e "5\ny\n" | gpg --batch --command-fd 0 \
            --edit-key "${{ secrets.GPG_KEY_ID }}" trust quit

      - name: Download RPMs temporarily
        run: |
          mkdir -p /tmp/packages
          gh release download ${{ github.event.release.tag_name }} \
            --pattern "*.rpm" \
            --dir /tmp/packages/ \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata with release download URLs
        run: |
          TAG=${{ github.event.release.tag_name }}
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          
          mkdir -p /tmp/repo
          cp /tmp/packages/*.rpm /tmp/repo/
          
          # generate metadata
          createrepo_c /tmp/repo/
          
          # copy only repodata (no RPMs) to gh-pages
          rm -rf repodata
          cp -r /tmp/repo/repodata .
          
          # write .repo pointing to github releases for actual RPMs
          printf "[antigravity]\nname=Antigravity RPM Repository\nbaseurl=${RELEASE_BASE}/\nenabled=1\ngpgcheck=0\nrepo_gpgcheck=1\ngpgkey=https://hk4crprasad.github.io/antigravity-rpm-repo/RPM-GPG-KEY.asc\nmetadata_expire=1d\n" > antigravity.repo

      - name: Sign repomd.xml
        run: |
          gpg --batch --yes \
            --default-key "${{ secrets.GPG_KEY_ID }}" \
            --detach-sign --armor repodata/repomd.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repo: update for ${{ github.event.release.tag_name }}" \
            || echo "Nothing to commit"
          git push origin gh-pages
